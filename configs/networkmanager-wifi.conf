# NetworkManager WiFi Backend Configuration
# Use iwd instead of wpa_supplicant for better WiFi 7 support
#
# Copy to: /etc/NetworkManager/conf.d/wifi_backend.conf
# Then: sudo systemctl restart NetworkManager

[device]
wifi.backend=iwd

# Optional: Enable MAC randomization for privacy
[connection]
wifi.cloned-mac-address=random

[main]
# Enable DNS over TLS (optional)
# dns=systemd-resolved

# Disable connectivity checking (optional)
# [connectivity]
# enabled=false
