# TLP Configuration for ThinkPad X1 Carbon Gen 13 (Lunar Lake)
#
# This configuration is optimized for the X1C Gen 13 with Lunar Lake
# Copy to /etc/tlp.conf and adjust as needed
#
# After changes, run: sudo tlp start

# Operation mode: AC, BAT
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# Power supply class to ignore when determining operation mode
TLP_PS_IGNORE=BAT

# Battery charge thresholds (ThinkPad specific)
# Prolongs battery lifespan by limiting charge to 80% on AC power
# Set to 100 if you need full charge
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# CPU settings
# Lunar Lake supports Intel P-state
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

# CPU scaling governor
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# CPU energy performance hint
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# CPU boost
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform profile (Lunar Lake specific)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# Intel GPU settings
# Enable RC6 power saving and framebuffer compression
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=0  # 0 = no limit
INTEL_GPU_MAX_FREQ_ON_BAT=800
INTEL_GPU_BOOST_FREQ_ON_AC=0
INTEL_GPU_BOOST_FREQ_ON_BAT=0

# WiFi power saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable WiFi on battery if not needed
#DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="wifi"

# Bluetooth
# Auto disable when not in use
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"
DEVICES_TO_ENABLE_ON_STARTUP=""

# Audio power saving
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# PCIe Active State Power Management
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# USB autosuspend
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0

# Runtime Power Management for PCI(e) devices
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Runtime PM for specific devices
#RUNTIME_PM_DRIVER_DENYLIST="nouveau nvidia radeon"

# NVMe power saving
# APST (Autonomous Power State Transition)
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto

# SATA link power management
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# Disk devices
# Enable SATA link power management
DISK_DEVICES="nvme0n1"
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

# NVMe specific
DISK_IOSCHED="none none"

# Restore radio device state on startup
RESTORE_DEVICE_STATE_ON_STARTUP=0

# Suspend/resume settings
# Restore charge threshold on resume
RESTORE_THRESHOLDS_ON_BAT=1

# Battery feature drivers
NATACPI_ENABLE=1
TPACPI_ENABLE=1
TPSMAPI_ENABLE=0

# Additional settings for Lunar Lake
# These are experimental and may need adjustment

# Enable deeper C-states
#NMI_WATCHDOG=0

# Dirty page writeback
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# Notes:
# - Adjust charge thresholds based on your usage pattern
# - Monitor battery with: tlp-stat -b
# - Check configuration with: sudo tlp-stat -c
# - For maximum battery life, keep laptop plugged in with 75-80% threshold
# - For maximum performance, disable USB autosuspend for peripherals
